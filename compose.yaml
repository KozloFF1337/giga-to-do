services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: giga_todo
      POSTGRES_USER: giga_todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giga_todo -d giga_todo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
